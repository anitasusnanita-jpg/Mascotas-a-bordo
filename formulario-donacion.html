<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de donación | Mascota a Bordo</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <main class="pagina">
        <a class="volver" href="donaciones.html">← Volver a donaciones</a>
        <h1 class="titulo-pagina"><span>Formulario</span><br>de donación</h1>
        <p class="texto-intro">Gracias por querer apoyar. Llena tus datos y el equipo se pondrá en contacto contigo.</p>

        <form class="mini-form" action="#" method="get">
            <label>Tu nombre:
                <input type="text" name="nombre" required>
            </label>
            <label>Tu correo:
                <input type="email" name="correo" required>
            </label>
            <label>Tipo de donación:
                <select name="tipo">
                    <option>Económica</option>
                    <option>En especie</option>
                </select>
            </label>
            <label>Monto o detalle:
                <input type="text" name="detalle">
            </label>
            <button class="boton-enlace" type="submit">Enviar</button>
        </form>
    </main>
</body>
</html>
