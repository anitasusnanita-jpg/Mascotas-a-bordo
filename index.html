<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascota a Bordo</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        /* --- ESTILOS EXCLUSIVOS PARA MEJORAR EL INDEX (SIN TOCAR ESTILO.CSS) --- */
        
        .inicio {
            position: relative;
            overflow: hidden;
        }

        /* Una forma decorativa de fondo para darle profundidad */
        .inicio::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 50%;
            height: 120%;
            background: #ead0a5;
            border-radius: 50%;
            z-index: 0;
            opacity: 0.4;
        }

        .contenido {
            z-index: 2; /* Asegura que el texto esté por encima de la forma */
        }

        /* Insignia del equipo más elegante */
        .insignia-equipo {
            display: inline-block;
            background: #557d35;
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(85, 125, 53, 0.3);
        }

        /* Hacer el texto del equipo más limpio */
        .equipo p {
            font-size: 0.95rem;
            color: #51463d;
            line-height: 1.6;
        }

        /* --- DISEÑO DE LAS IMÁGENES (COLLAGE) --- */
        
        .collage-contenedor {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 560px;
            z-index: 1;
        }

        /* Imagen grande principal */
        .foto-principal {
            position: absolute;
            top: 10%;
            right: 5%;
            width: 75%;
            height: 65%;
            object-fit: cover;
            border-radius: 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            border: 8px solid #fff8ec;
            transform: rotate(-2deg);
            transition: transform 0.4s ease;
        }

        /* Imagen más pequeña superpuesta */
        .foto-secundaria {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 55%;
            height: 45%;
            object-fit: cover;
            border-radius: 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            border: 8px solid #fff8ec;
            transform: rotate(3deg);
            transition: transform 0.4s ease;
        }

        .collage-contenedor:hover .foto-principal {
            transform: rotate(0deg) scale(1.02);
        }
        
        .collage-contenedor:hover .foto-secundaria {
            transform: rotate(0deg) scale(1.02);
        }

        /* Tarjeta flotante con mensaje */
        .tarjeta-flotante {
            position: absolute;
            top: 50%;
            left: 25%;
            transform: translate(-50%, -50%) rotate(-5deg);
            background: #f2b632;
            color: #332b2e;
            padding: 18px 24px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 1.1rem;
            text-align: center;
            box-shadow: 0 10px 20px rgba(242, 182, 50, 0.4);
            z-index: 10;
            line-height: 1.3;
            border: 3px solid #fff8ec;
        }

        @media (max-width: 760px) {
            .collage-contenedor {
                min-height: 400px;
            }
            .foto-principal {
                width: 85%;
                height: 60%;
                top: 5%;
            }
            .foto-secundaria {
                width: 60%;
                height: 40%;
            }
            .tarjeta-flotante {
                font-size: 0.9rem;
                padding: 12px 16px;
                left: 20%;
                top: 45%;
            }
            .inicio::before {
                width: 100%;
                height: 50%;
                top: 50%;
                left: 0;
            }
        }
    </style>
</head>
<body>
    <main class="inicio">
        <section class="contenido">
            <div class="decoracion">✿</div>
            <h1><span>Mascota</span><br>A Bordo</h1>

            <div class="equipo">
                <div class="insignia-equipo">Nuestro Equipo</div>
                <p>
                    Gonzalez Limon Kimberly<br>
                    Arista Flores Karla Gissel<br>
                    Martinez Urcino Jocelyn<br>
                    Rojas Ortiz Austin Alberto
                </p>
            </div>

            <nav class="botones" aria-label="Menú principal">
                <a href="catalogo.html">Catálogo</a>
                <a href="buzon.html">Buzón de preguntas</a>
                <a href="formulario-donacion.html">Sección de donación</a>
                <a href="extravios.html">Reporte de extravíos</a>
            </nav>
        </section>

        <section class="ilustraciones">
            <!-- Reemplazamos el diseño anterior por un collage moderno -->
            <div class="collage-contenedor">
                <!-- Nueva imagen principal: Un perrito golden retriever muy feliz y estético -->
                <img class="foto-principal" src="https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=800&q=85" alt="Perro feliz">
                
                <!-- Nueva imagen secundaria: Un gatito súper tierno mirando hacia arriba -->
                <img class="foto-secundaria" src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=600&q=85" alt="Gatito tierno">
                
                <div class="tarjeta-flotante">
                    Ayuda a cuidar<br>y dar amor 🐾
                </div>
            </div>
        </section>
    </main>
</body>
</html>
